    <script>
      // Apply the saved language before first paint (same key as changeLanguage() in index.js)
      (function () {
        try {
          var q = new URLSearchParams(window.location.search).get('lang');
          var l = q === 'hu' || q === 'en' ? q : localStorage.getItem('selectedLanguage');
          if (l === 'hu' || l === 'en') document.documentElement.lang = l;
          if (l === 'en') {
            document.documentElement.classList.add('i18n-pending');
            setTimeout(function () { document.documentElement.classList.remove('i18n-pending'); }, 3000);
          }
        } catch (e) {}
      })();
    </script>
